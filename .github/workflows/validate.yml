name: Validate

# hacs/action and hassfest stay on their branch refs on purpose: both are
# validators whose rules must track upstream, a SHA pin would freeze them and
# Dependabot does not move branch-based pins. The jobs run with a read-only
# token and no secrets, so a bad upstream commit can fail the check but not
# publish anything. Every tag-based action is pinned to a SHA.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@master
