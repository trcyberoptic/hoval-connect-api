name: Release

on:
  push:
    tags:
      - "v*"
  # Manual path, for cutting a release without a local git client. The tag is
  # created by action-gh-release below rather than pushed, so this job does not
  # re-trigger itself (events authored by GITHUB_TOKEN never start a workflow).
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release, e.g. "v1.0.6". Must match manifest.json.'
        required: true
        type: string

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Empty on a tag push, set on workflow_dispatch.
          VERSION="${INPUT_VERSION:-${GITHUB_REF#refs/tags/}}"
          case "$VERSION" in
            v[0-9]*) ;;
            *) echo "::error::Version '$VERSION' must look like v1.2.3"; exit 1 ;;
          esac
          # A tag that disagrees with manifest.json ships a version HACS and the
          # integration report differently. Cheap to check, expensive to undo:
          # the release is what users install.
          MANIFEST=$(python3 -c "import json;print(json.load(open('custom_components/hoval_connect/manifest.json'))['version'])")
          if [ "$VERSION" != "v$MANIFEST" ]; then
            echo "::error::Tag $VERSION does not match manifest.json version $MANIFEST"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges)
          fi
          {
            echo "changes<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit, because on workflow_dispatch there is no tag ref to infer
          # from — the action creates the tag at the checked-out commit.
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changes }}
          generate_release_notes: false
