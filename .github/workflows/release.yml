name: Release

on:
  push:
    tags:
      - "v*"
  # Manual path, for cutting a release without a local git client. The tag is
  # created by action-gh-release below rather than pushed, so this job does not
  # re-trigger itself (events authored by GITHUB_TOKEN never start a workflow).
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release, e.g. "v1.0.6". Must match manifest.json.'
        required: true
        type: string

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Empty on a tag push, set on workflow_dispatch.
          VERSION="${INPUT_VERSION:-${GITHUB_REF#refs/tags/}}"
          case "$VERSION" in
            v[0-9]*) ;;
            *) echo "::error::Version '$VERSION' must look like v1.2.3"; exit 1 ;;
          esac
          # A tag that disagrees with manifest.json ships a version HACS and the
          # integration report differently. Cheap to check, expensive to undo:
          # the release is what users install.
          MANIFEST=$(python3 -c "import json;print(json.load(open('custom_components/hoval_connect/manifest.json'))['version'])")
          if [ "$VERSION" != "v$MANIFEST" ]; then
            echo "::error::Tag $VERSION does not match manifest.json version $MANIFEST"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The release notes are the CHANGELOG.md section for this version
          # ("## [X.Y.Z]" up to the next "## " heading). Matching on the version only,
          # so the heading may still say "Unreleased" on release day.
          NUMBER="${VERSION#v}"
          NOTES=$(awk -v h="## [$NUMBER]" '
            index($0, h) == 1 { on = 1; next }
            on && index($0, "## ") == 1 { exit }
            on { print }
          ' CHANGELOG.md | sed -e '/./,$!d')
          if [ -z "$NOTES" ]; then
            echo "::error::CHANGELOG.md has no '## [$NUMBER]' section (or it is empty)"
            exit 1
          fi
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LINK="Full changes: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${VERSION}"
            NOTES=$(printf '%s\n\n%s' "$NOTES" "$LINK")
          fi
          {
            echo "changes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # Explicit, because on workflow_dispatch there is no tag ref to infer
          # from — the action creates the tag at the checked-out commit.
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changes }}
          generate_release_notes: false
          # A hyphen in the version (v2.0.0-beta.1) marks a test build: a GitHub
          # pre-release that is not "Latest", so HACS does not offer it as an
          # update. Testers pick it via Redownload.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          make_latest: ${{ contains(steps.version.outputs.version, '-') && 'false' || 'true' }}
